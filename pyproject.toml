[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d4-pageindex"
version = "0.1.0"
description = "Vectorless RAG via markdown header parsing for Dionysus 4"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Internal" }
dependencies = []

[project.optional-dependencies]
eventbus = ["d4-eventbus>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
d4-eventbus = { git = "https://github.com/bionicbutterfly13/d4-eventbus", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["d4_pageindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["d4_pageindex"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
