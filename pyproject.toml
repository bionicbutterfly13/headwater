[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "headwater"
version = "0.2.0"
description = "Vectorless RAG via markdown header parsing (formerly d4-pageindex)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
eventbus = ["d4-eventbus>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
d4-eventbus = { git = "https://github.com/bionicbutterfly13/d4-eventbus", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["headwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["headwater"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
